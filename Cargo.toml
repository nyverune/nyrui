[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/apps/*",
]
default-members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nyverune/nyrui"

[workspace.dependencies]
smallvec = "1.13"
nyrui-core = { path = "crates/nyrui-core", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
redundant_explicit_links = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
